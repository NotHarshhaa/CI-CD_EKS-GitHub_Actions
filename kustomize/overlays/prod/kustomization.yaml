apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-prod

resources:
  - ../../base

patches:
  - path: deploy-prod.yaml
  - path: ingress-prod.yaml

labels:
  - includeSelectors: false
    pairs:
      environment: production
      tier: application

images:
  - name: node-app
    newTag: latest

replicas:
  - name: web-deployment
    count: 3

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - ENV=production
      - LOG_LEVEL=warn

# Secrets (e.g. TLS certs) are provisioned out-of-band, not committed:
#   kubectl -n app-prod create secret generic app-prod-secrets --from-env-file=secrets.env
