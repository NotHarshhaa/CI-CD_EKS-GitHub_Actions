name: Production CD Pipeline

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: calculator-app
  # Must match terraform locals: e2ecicd-eks-${environment} for env "prod"
  EKS_CLUSTER_NAME: e2ecicd-eks-prod
  EKS_NAMESPACE: app-prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Run tests
      run: |
        cd app
        npm ci
        npm test

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd app
        IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
        docker build --target production \
          -t "$IMAGE:$IMAGE_TAG" \
          -t "$IMAGE:latest" .
        docker push "$IMAGE:$IMAGE_TAG"
        docker push "$IMAGE:latest"
        echo "image=$IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy-to-eks:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Kustomize
      uses: azure/setup-kustomize@v4
      with:
        version: 'latest'

    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

    - name: Deploy to EKS
      working-directory: kustomize/overlays/prod
      env:
        IMAGE: ${{ needs.build-and-push.outputs.image }}
      run: |
        kustomize edit set image "node-app=$IMAGE"
        kustomize build .
        kubectl apply -k .

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/web-deployment -n "$EKS_NAMESPACE" --timeout=300s
        kubectl get pods -l app=web -n "$EKS_NAMESPACE"

    - name: Run smoke tests
      run: |
        # The app Service is ClusterIP; traffic enters through the ingress controller LB
        SERVICE_URL=$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        if [ -z "$SERVICE_URL" ]; then
          echo "Ingress controller LoadBalancer hostname not found"
          exit 1
        fi
        echo "Service URL: http://$SERVICE_URL"

        HEALTH_PASSED=false
        for i in $(seq 1 30); do
          # Ingress redirects HTTP->HTTPS (301), so probe HTTPS directly.
          # -k accepts the real cert or ingress-nginx's fallback cert.
          if curl -sk --resolve "prod.afraz.dev:443:$SERVICE_URL" "https://prod.afraz.dev/health" | grep -q '"status":"healthy"'; then
            echo "Health check passed"
            HEALTH_PASSED=true
            break
          fi
          echo "Waiting for service to be ready... ($i/30)"
          sleep 10
        done

        if [ "$HEALTH_PASSED" != "true" ]; then
          echo "::error::Health check failed after 30 attempts"
          exit 1
        fi

    - name: Run security scan on deployed image
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ needs.build-and-push.outputs.image }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
