apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-staging

resources:
  - ../../base

patches:
  - path: deploy-staging.yaml
  - path: ingress-staging.yaml

labels:
  - includeSelectors: false
    pairs:
      environment: staging

images:
  - name: node-app
    newTag: latest

replicas:
  - name: web-deployment
    count: 2

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - ENV=staging
      - LOG_LEVEL=info
