apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-dev

resources:
  - ../../base

patches:
  - path: deploy-dev.yaml
  - path: ingress-dev.yaml

labels:
  - includeSelectors: false
    pairs:
      environment: dev

images:
  - name: node-app
    newTag: latest

replicas:
  - name: web-deployment
    count: 1

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - ENV=development
      - LOG_LEVEL=debug
